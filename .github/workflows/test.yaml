name: Run Test
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Pront node version
        run: node -v
      - name: Install dependencies
        run: npm install
      - name: Build Project
        run: npm run build
      - name: Job is completed  
        run: echo "Job is completed successfully"