name: Setup Nodejs and install dependencies
description: This action sets up Node.js and installs dependencies for a project.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash